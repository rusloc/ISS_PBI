<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .brand-orange { fill: #FF5500; }
      .brand-stroke { stroke: #FF5500; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .brand-text { font-family: 'Arial', 'Helvetica', sans-serif; fill: #FF5500; }
    </style>
  </defs>

  <g transform="translate(60, 20)">
    
    <line x1="20" y1="180" x2="220" y2="180" class="brand-stroke" />
    
    <circle cx="20" cy="180" r="10" class="brand-orange" />
    <circle cx="120" cy="180" r="10" class="brand-orange" />
    <circle cx="220" cy="180" r="10" class="brand-orange" />

    <g transform="translate(120, 110)">
       <path class="brand-stroke" d="M0 40 L-35 20 L-35 -20 L0 -40 L35 -20 L35 20 Z" />
       <path class="brand-stroke" d="M0 40 L0 0 M0 0 L-35 -20 M0 0 L35 -20" />
    </g>
    
  </g>

  <g transform="translate(330, 70)">
    <text x="0" y="90" font-size="100" font-weight="bold" class="brand-text">MyCOMS</text>
    
    <text x="5" y="140" font-size="24" font-weight="bold" class="brand-text">
      Customer Order Management System
    </text>
  </g>
</svg>